<!doctype html>
<html lang="ru">

<head>
  <title>ФМШ :: Регистрация</title>

  <!-- General meta-tags -->
  <meta charset="utf-8">
  <meta name="description" content="Страница регистрации сайта ФМШ">
  <meta name="keywords" content="ФМШ, физико-математическая, физмат, школа, образование, дополнительное образование, дистант, дистанционное образование, математика, физика, информатика">
  <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- Robots' meta-tags -->
  <meta name="robots" content="noindex">

  <!-- Resources -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/scripts.js"></script>
</head>

<body>
  <div id="content">
    <div id="main-block" style="height: 100vh;">
      <div class="screen-third small-padding">
        <!-- This block is a spacing block -->
      </div>
      <div class="screen-third" style="flex: auto">
        <div></div>
        <div id="form-holder">
          <div> <b>Фамилия:</b> <input type="text" size="32" name="surname" value=""> </div>
          <div> <b>Имя:</b> <input type="text" size="32" name="firstname" value=""> </div>
          <div> <b>Отчество:</b> <input type="text" size="32" name="lastname" value=""> </div>
          <div> <b>Дата рождения:</b> <input type="text" size="32" name="birthday" value="" placeholder="ДД.ММ.ГГГГ"> </div>
          <div> <b>Класс обучения:</b> <input type="text" size="32" name="class" value="" placeholder="Класс, в котором вы учитесь"> </div>
          <div> <b>Регион проживания:</b> <input type="text" size="32" name="region" value="" placeholder="Регион, в котором вы проживаете"> </div>
          <div> <b>Ближайшие станции метро:</b> <input type="text" size="32" name="town" value=""> </div>
          <div> <b>Учебное заведение:</b> <input type="text" size="32" name="school" value="" placeholder="Название школы или номер"> </div>
        </div>
        <div></div>
      </div>
      <div class="screen-third small-padding">
        <!-- This block is a spacing block -->
      </div>
    </div>
  </div>
</body>
</html>
