<!doctype html>
<html lang="ru">

<head>
  <title>ФМШ :: Регистрация</title>

  <!-- General meta-tags -->
  <meta charset="utf-8">
  <meta name="description" content="Страница регистрации сайта ФМШ">
  <meta name="keywords" content="ФМШ, физико-математическая, физмат, школа, образование, дополнительное образование, дистант, дистанционное образование, математика, физика, информатика">
  <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- Robots' meta-tags -->
  <meta name="robots" content="noindex">

  <!-- Resources -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/scripts.js"></script>
</head>

<body>
  <div id="content">
    <div id="main-block" style="height: 100vh;">
      <div class="screen-third small-padding">
        <!-- This block is a spacing block -->
      </div>
      <div class="screen-third" style="flex: auto">
        <div></div>
        <form action method="POST" class="form-holder" style="font-size: 80%;">

          <div style="padding: var(--proportional-x-small-padding);">
            <b>Регистрация</b>
          </div>
          
          <div class="form-body-holder" id="registration-form-holder">
            <div class="text-input-holder" id="surname-holder">
              <label class="form-label" for="surname"><b>Фамилия</b></label>
              <input id="surname" class="register-form-input highlight-left" type="text" name="surname">
            </div>
            <div class="text-input-holder" id="firstname-holder">
              <label class="form-label" for="firstname"><b>Имя</b></label>
              <input id="firstname" class="register-form-input highlight-left" type="text" name="firstname">
            </div>
            <div class="text-input-holder" id="lastname-holder">
              <label class="form-label" for="lastname"><b>Отчество</b></label>
              <input id="lastname" class="register-form-input highlight-left" type="text" name="lastname">
            </div>
            <div class="text-input-holder" id="email-holder">
              <label class="form-label" for="email"><b>Email</b></label>
              <input id="email" class="register-form-input highlight-left temp" type="email" name="email" placeholder="example@email.com" autocomplete="email">
            </div>
            <div class="text-input-holder" id="birthday-holder">
              <label class="form-label" for="birthday"><b>Дата рождения</b></label>
              <input id="birthday" type="text" name="birthday" placeholder="ДД.ММ.ГГГГ" maxlength="10" class='register-form-input highlight-left'>
            </div>
            <div class="text-input-holder" id="grade-holder">
              <label class="form-label" for="grade"><b>Класс обучения</b></label>
              <input id="grade" class="register-form-input highlight-left" type="text" name="grade" placeholder="4 – 11" maxlength="2" min="4" max="11">
            </div>
            <div class="text-input-holder" id="school-holder">
              <label class="form-label" for="school"><b>Учебное заведение</b></label>
              <input id="school" class="register-form-input highlight-left" type="text" name="school" placeholder="Название школы или номер">
            </div>
            <div class="text-input-holder" id="region-holder">
              <label class="form-label" for="region"><b>Регион проживания</b></label>
              <select id="region" class="register-form-input highlight-left select-css" type="text" name="region">
                <option>Россия, Москва</option>
                <option>Россия, Московская область&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp</option>
                <option>Россия, другой регион</option>
                <option>Другое государство</option>
              </select>
            </div>
            <div class="text-input-holder" id="town-holder">
              <label id="town-label" class="form-label" for="town"><b>Ближайшие станции метро</b></label>
              <input id="town" class="register-form-input highlight-left" type="text" name="town">
            </div>
          </div>

          <div class="text-input-holder">
            <button type="submit">Зарегестрироваться</button>
          </div>
        </form>
        <div></div>
      </div>
      <div class="screen-third small-padding">
        <!-- This block is a spacing block -->
      </div>
    </div>
  </div>
</body>
</html>
